name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Lint + Debug build
        run: |
          set -o pipefail
          gradle --no-daemon lintDebug assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Job logs are not readable from the cloud session; errors as annotation are.
      - name: Errors as annotation
        if: failure()
        run: |
          {
            grep -E "^e: |: Error: |error: |What went wrong" -A3 "$RUNNER_TEMP/build.log" || true
            if [ -f app/build/reports/lint-results-debug.txt ]; then cat app/build/reports/lint-results-debug.txt; fi
          } | grep -v "^--$" | head -80 | sed "s#$GITHUB_WORKSPACE/##g" > "$RUNNER_TEMP/err.txt"
          echo "::error title=Build errors::$(sed -z 's/%/%25/g; s/\r//g; s/\n/%0A/g' "$RUNNER_TEMP/err.txt")"

      - name: Lint warnings as annotation
        if: success()
        run: |
          F=app/build/reports/lint-results-debug.txt
          [ -f "$F" ] || exit 0
          grep -E "Warning:|Error:" "$F" | sed "s#$GITHUB_WORKSPACE/##g" | head -60 > "$RUNNER_TEMP/lint.txt" || true
          [ -s "$RUNNER_TEMP/lint.txt" ] && echo "::notice title=Lint::$(sed -z 's/%/%25/g; s/\r//g; s/\n/%0A/g' "$RUNNER_TEMP/lint.txt")" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Release build (signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD fehlen - signiere mit Debug-Key"
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi
          gradle --no-daemon assembleRelease

      - name: Size report
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "APK_BYTES=$(stat -c %s "$APK")" >> "$GITHUB_ENV"
          {
            echo "## APK sizes (bytes)"
            ls -l app/build/outputs/apk/*/*.apk | awk '{print $5, $9}'
            echo "## Release content (uncompressed compressed name)"
            unzip -lv "$APK" | awk 'NR>3 {print $1, $3, $8}'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # SHA-1 of the signing certificate: needed for the Android OAuth client (Google Tasks).
      - name: Signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA1=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-1 digest: //p' | head -1 | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          echo "CERT_SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "## Signing certificate SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA1" >> "$GITHUB_STEP_SUMMARY"

      - name: "Cert SHA-1: ${{ env.CERT_SHA1 }}"
        run: echo "${{ env.CERT_SHA1 }}"

      - name: "Release APK: ${{ env.APK_BYTES }} bytes (${{ env.SIGNING }})"
        run: echo "release apk ${{ env.APK_BYTES }} bytes, ${{ env.SIGNING }}"

      - uses: actions/upload-artifact@v6
        with:
          name: AgendaGo-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
