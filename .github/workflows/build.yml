name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Lint + Debug build
        run: gradle --no-daemon lintDebug assembleDebug

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Release build (signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD fehlen - signiere mit Debug-Key"
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi
          gradle --no-daemon assembleRelease

      - name: Size report
        if: always()
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "APK_BYTES=$(stat -c %s "$APK")" >> "$GITHUB_ENV"
          {
            echo "## APK sizes (bytes)"
            ls -l app/build/outputs/apk/*/*.apk | awk '{print $5, $9}'
            echo "## Release content (uncompressed compressed name)"
            unzip -lv "$APK" | awk 'NR>3 {print $1, $3, $8}'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Release APK: ${{ env.APK_BYTES }} bytes (${{ env.SIGNING }})"
        run: echo "release apk ${{ env.APK_BYTES }} bytes, ${{ env.SIGNING }}"

      - uses: actions/upload-artifact@v6
        with:
          name: MinCalWidget-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
